name: Production release smoke
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full deployed commit SHA (optional, defaults to current main)
        type: string
        required: false
  workflow_run:
    workflows: [Python checks]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - name: Identify the release awaiting verification
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Provide a full lowercase Git commit SHA.'
            exit 1
          fi
          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$REVISION...main" --jq .status)
          if [[ "$relation" != identical && "$relation" != ahead ]]; then
            echo '::error::The selected release revision must belong to main.'
            exit 1
          fi
          echo "sha=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact promoted revision and public routes
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
          SITE_MONITOR_TOKEN: ${{ secrets.SITE_MONITOR_TOKEN }}
        run: |
          set -o pipefail
          echo "Release $REVISION · https://getinformdaily.com/" >> "$GITHUB_STEP_SUMMARY"
          python -m scripts.check_production_release "$REVISION" --wait-seconds 120 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open or update the release incident
        if: failure() && steps.revision.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.revision.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report-incident.sh "Production smoke failed" "$REVISION" "$RUN_URL"

  main-ci-failed:
    name: Report a failed main build
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open or update the release incident
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bash .github/scripts/report-incident.sh "Release CI failed on main" "$REVISION" "$RUN_URL"
