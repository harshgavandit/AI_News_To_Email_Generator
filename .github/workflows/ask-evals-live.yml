name: Ask Informa live evaluation
on:
  workflow_dispatch:
    inputs:
      deep:
        description: Score the Deep Ask research agent
        type: boolean
        default: false
      watch:
        description: Score the Watch agent against a synthetic archive
        type: boolean
        default: false
      editor:
        description: Score the Editor agent against a synthetic archive
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ask-evals-live
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Score configured model against synthetic archive
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          NEWS_AI_MODEL_STANDARD: ${{ vars.NEWS_AI_MODEL_STANDARD }}
          NEWS_AI_MODEL_FAST: ${{ vars.NEWS_AI_MODEL_FAST }}
          NEWS_AI_MODEL_DEEP: ${{ vars.NEWS_AI_MODEL_DEEP }}
          NEWS_AI_DAILY_BUDGET_USD: ${{ vars.NEWS_AI_DAILY_BUDGET_USD }}
          DEEP_EVAL: ${{ inputs.deep }}
          WATCH_EVAL: ${{ inputs.watch }}
          EDITOR_EVAL: ${{ inputs.editor }}
        run: |
          flags=(--live)
          if [[ "$EDITOR_EVAL" == "true" ]]; then flags+=(--editor)
          elif [[ "$WATCH_EVAL" == "true" ]]; then flags+=(--watch)
          elif [[ "$DEEP_EVAL" == "true" ]]; then flags+=(--deep); fi
          uv run --no-sync python -m scripts.run_evals "${flags[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the scored results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ask-informa-live-eval
          path: ${{ inputs.editor && 'evals/results/latest-editor.json' || inputs.watch && 'evals/results/latest-watch.json' || inputs.deep && 'evals/results/latest-deep.json' || 'evals/results/latest.json' }}
          if-no-files-found: ignore
          retention-days: 14
