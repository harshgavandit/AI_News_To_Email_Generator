name: Site health
# Daily check of the public pages and APIs readers depend on. Read-only: it never fetches feeds,
# sends mail or changes data, and it runs on its own schedule, separate from the feed sweeps.
on:
  schedule:
    - cron: '41 23 * * *'  # 05:11 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-health
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://getinformdaily.com
    steps:
      - name: Check pages, APIs and feeds
        shell: bash
        env:
          SITE_MONITOR_TOKEN: ${{ secrets.SITE_MONITOR_TOKEN }}
        run: |
          set -uo pipefail
          failures=0
          workdir=$(mktemp -d)
          trap 'rm -rf -- "$workdir"' EXIT
          body="$workdir/body"
          headers="$workdir/headers"
          check() {
            local name="$1" path="$2" test="$3" min="${4:-200}" status size request_id failure
            : > "$body"
            : > "$headers"
            if ! status=$(curl --silent --show-error --max-time 30 --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              --header @- "$SITE$path" <<< "X-Informa-Site-Monitor: $SITE_MONITOR_TOKEN"); then
              status=000
            fi
            size=$(wc -c < "$body")
            request_id=$(awk 'tolower($1) == "x-request-id:" { id=$2 } END { sub(/\r$/, "", id); if (id ~ /^[0-9a-f]+$/) print id }' "$headers")
            failure=""
            if [[ "$path" == /api/recap && "$status" == 404 ]] && jq -e '.detail | strings | startswith("That week")' "$body" >/dev/null 2>&1; then
              echo "::warning::No weekly recap is published yet. Run the 'Prepare weekly recap' workflow."
              return
            elif [[ "$status" == 503 ]] && jq -e '.detail == "The news database is temporarily unavailable."' "$body" >/dev/null 2>&1; then
              failure="HTTP 503: archive database unavailable"
            elif [[ "$path" == /api/ready && "$status" == 503 ]] && jq -e '.freshness.counts.fresh == 0' "$body" >/dev/null 2>&1; then
              failure="HTTP 503: no fresh publisher sources ($(jq -r '.freshness.counts | "\(.stale) stale, \(.failed) failed, \(.pending) pending"' "$body"))"
            elif [[ "$status" == 402 ]]; then
              failure="HTTP 402: Vercel deployment unavailable. Check project usage and deployment status."
            elif [[ "$status" == 429 ]] && grep -qi '^x-vercel-mitigated: challenge' "$headers"; then
              failure="HTTP 429: Vercel challenged this monitor. Check the firewall rule and SITE_MONITOR_TOKEN."
            elif [[ "$status" != 200 || "$size" -lt "$min" ]]; then
              failure="HTTP $status, $size bytes"
            elif [[ -n "$test" ]] && ! jq -e "$test" "$body" >/dev/null 2>&1; then
              failure="HTTP 200, unexpected response content"
            fi
            if [[ -n "$failure" ]]; then
              local message="$name ($path) failed: $failure${request_id:+ (request ID $request_id)}"
              echo "::error::$message"
              echo "Failed — $message" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
              return
            fi
            echo "ok  $name ($status, $size bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          check "Home page" / "" 5000
          check "API liveness" /api/health '.status == "ok"' 10
          check "Archive readiness" /api/ready '.freshness.counts.fresh > 0' 10
          check "Latest stories" '/api/news?hours=24&limit=1&catalog=0' '.articles | length > 0' 10
          check "Developing stories" /api/headlines '.articles != null' 50
          check "Curiosity Cards" '/api/curiosity/cards?limit=6' '.cards | length > 0'
          check "Trackers: releases" /api/trackers/releases '.items | length > 0'
          check "Trackers: security" /api/trackers/security '.items.cves != null'
          check "Alerts config" /api/push/config '.enabled != null' 10
          if jq -e '.enabled == false' "$body" >/dev/null 2>&1; then
            echo "::warning::Device alerts are off: set NEWS_PUSH_VAPID_PRIVATE_KEY in Vercel (docs/PUSH-ALERTS.md)."
          fi
          check "RSS: latest" /feeds/latest.xml "" 500
          check "RSS: Curiosity" /feeds/curiosity.xml "" 500
          check "Sitemap" /sitemap.xml "" 200
          check "Service worker" /sw.js "" 200
          check "Weekly recap" /api/recap '.week | strings | length > 0' 10
          exit $(( failures > 0 ))
