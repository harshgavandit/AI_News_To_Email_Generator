name: Python checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend test dependencies
        run: npm ci
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Check Python and frontend syntax
        run: |
          uv run ruff check app tests scripts main.py
          uv run python -m compileall -q app main.py
          npm run lint
          npm run build
          npm test
      - name: Test API, feed handling, and delivery controls
        run: uv run python -m pytest -q
  mail-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: capacity
          POSTGRES_USER: capacity
          POSTGRES_PASSWORD: capacity
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U capacity -d capacity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic 10,000-recipient rehearsal
        env:
          UV_PYTHON: '3.12'
        run: |
          python -m pip install uv
          uv sync --frozen
          uv run python -m scripts.check_mail_capacity --postgres
      - name: Test the archive upgrade and intelligence on PostgreSQL
        env:
          UV_PYTHON: '3.12'
          TEST_NEWS_POSTGRES_URL: postgresql+psycopg://capacity:capacity@127.0.0.1:55432/capacity
        run: uv run pytest -q tests/test_global_discovery.py tests/test_syndication.py tests/test_research.py
