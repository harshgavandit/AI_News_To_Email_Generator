name: Python checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, Staging]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Skip build and test gates for Markdown-only changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Everything except Markdown counts as code: docs/research JSON feeds the tests.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Base commit unavailable; running every gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              *.md) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Lint, compile and check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git -c core.whitespace=cr-at-eol diff --check "$BASE_SHA" HEAD
          uv run --no-sync ruff check app tests scripts main.py
          uv run --no-sync python -m compileall -q app main.py
      - name: Check formatting, maintainability and types of release tooling
        if: matrix.python-version == '3.12'
        run: |
          files=(scripts/check_release_schema.py scripts/check_release_browser.py scripts/check_production_release.py tests/test_release_gates.py scripts/check_type_baseline.py tests/test_type_baseline.py)
          uv run --no-sync ruff format --check "${files[@]}"
          uv run --no-sync ruff check --select C90 --config 'lint.mccabe.max-complexity = 14' "${files[@]}"
          uv run --no-sync mypy --strict --follow-imports=silent "${files[@]:0:3}" scripts/check_type_baseline.py
      - name: Block new type errors in the application (ratchet)
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python -m scripts.check_type_baseline
      - name: Require Ruff formatting for new Python files
        if: matrix.python-version == '3.12'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -t added < <(git diff --diff-filter=A --name-only "$BASE_SHA" HEAD -- '*.py' 2>/dev/null || true)
          if (( ${#added[@]} )); then
            uv run --no-sync ruff format --check "${added[@]}"
          else
            echo "No new Python files."
          fi
      - name: Test and enforce branch-inclusive coverage
        if: matrix.python-version == '3.12'
        run: |
          uv run --no-sync coverage run --branch --source app -m pytest -q
          uv run --no-sync coverage report --precision=2 --fail-under=79 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test second supported Python version
        if: matrix.python-version == '3.14'
        run: uv run --no-sync pytest -q
      - name: Replay reader intelligence quality cases
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python -m scripts.check_reader_quality
      - name: Score Ask Informa with an offline model stub
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          uv run --no-sync python -m scripts.run_evals | tee -a "$GITHUB_STEP_SUMMARY"
          uv run --no-sync python -m scripts.run_evals --deep | tee -a "$GITHUB_STEP_SUMMARY"
          uv run --no-sync python -m scripts.run_evals --watch | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend build and browser smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: uv sync --locked
      - name: Install headless Chromium
        run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - name: Test reader journeys against the production assets
        run: uv run --no-sync python -m scripts.check_release_browser

  security:
    name: Supply chain and static security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan proposed commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Scan npm lockfile for high and critical advisories
        run: npm audit --audit-level=high
      - run: uv sync --locked
      - name: Scan locked Python runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/informa-dependencies.txt"
          uvx pip-audit==2.10.1 --no-deps --disable-pip -r "$RUNNER_TEMP/informa-dependencies.txt"
      - name: Scan first-party Python for high-confidence, high-severity findings
        run: uv run --no-sync bandit -q -r -lll -iii app scripts

  database:
    name: PostgreSQL migration and integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: capacity
          POSTGRES_USER: capacity
          POSTGRES_PASSWORD: capacity
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U capacity -d capacity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Compare the proposed schema to the target branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- app scripts '*.sql' pyproject.toml uv.lock; then
            echo "No application, SQL, migration script, or Python dependency changes."
            exit 0
          fi
          mkdir "$RUNNER_TEMP/base"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/base"
          (
            cd "$RUNNER_TEMP/base"
            PYTHONPATH="$PWD" "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_release_schema.py"
          ) > "$RUNNER_TEMP/before.json"
          uv run --no-sync python -m scripts.check_release_schema > "$RUNNER_TEMP/after.json"
          git diff --unified=0 "$BASE_SHA" HEAD -- app scripts '*.sql' > "$RUNNER_TEMP/schema.diff"
          uv run --no-sync python -m scripts.check_release_schema \
            "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" --sql-diff "$RUNNER_TEMP/schema.diff"
      - name: Rehearse 10,000 synthetic recipients on PostgreSQL
        run: uv run --no-sync python -m scripts.check_mail_capacity --postgres
      - name: Test legacy schema upgrades, archive reads, and AI features on PostgreSQL
        env:
          TEST_NEWS_POSTGRES_URL: postgresql+psycopg://capacity:capacity@127.0.0.1:55432/capacity
        run: >-
          uv run --no-sync pytest -q tests/test_global_discovery.py tests/test_syndication.py
          tests/test_research.py tests/test_reader_intelligence.py tests/test_guardrails.py
          tests/test_ask.py tests/test_mcp_connector.py tests/test_deep_ask.py tests/test_watch_agent.py

  release:
    name: Release CI
    needs: [changes, verify, frontend, security, database]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every quality gate to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PYTHON: ${{ needs.verify.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SECURITY: ${{ needs.security.result }}
          DATABASE: ${{ needs.database.result }}
        run: |
          printf '| Gate | Result |\n| --- | --- |\n| Changed areas | %s (code: %s) |\n| Python | %s |\n| Frontend | %s |\n| Security | %s |\n| PostgreSQL | %s |\n' \
            "$CHANGES" "$CODE" "$PYTHON" "$FRONTEND" "$SECURITY" "$DATABASE" >> "$GITHUB_STEP_SUMMARY"
          # Build and test gates may be skipped only when the change is Markdown alone.
          allowed=success
          [[ "$CHANGES" == success && "$CODE" == false ]] && allowed=skipped
          blocked=false
          [[ "$CHANGES" != success || "$SECURITY" != success ]] && blocked=true
          for result in "$PYTHON" "$FRONTEND" "$DATABASE"; do
            [[ "$result" == success || "$result" == "$allowed" ]] || blocked=true
          done
          if [[ "$blocked" == true ]]; then
            echo "::error::Release blocked. Open the jobs above for the failing quality gate."
            exit 1
          fi
