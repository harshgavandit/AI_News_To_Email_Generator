name: Python checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHON_DOTENV_DISABLED: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend test dependencies
        run: npm ci
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Check Python and frontend syntax
        run: |
          uv run ruff check app tests scripts main.py
          uv run python -m compileall -q app main.py
          npm run lint
          npm run build
          npm test
      - name: Test API, feed handling, and delivery controls
        run: uv run python -m pytest -q
      - name: Check locked dependencies for security advisories
        if: matrix.python-version == '3.12'
        run: |
          npm audit --audit-level=high
          python -m pip install pip-audit==2.10.1
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/informa-dependencies.txt"
          pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/informa-dependencies.txt"
      - name: Replay reader intelligence quality cases
        run: uv run python -m scripts.check_reader_quality
  mail-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: capacity
          POSTGRES_USER: capacity
          POSTGRES_PASSWORD: capacity
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U capacity -d capacity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run synthetic 10,000-recipient rehearsal
        env:
          UV_PYTHON: '3.12'
        run: |
          python -m pip install uv
          uv sync --frozen
          uv run python -m scripts.check_mail_capacity --postgres
      - name: Test the archive upgrade and intelligence on PostgreSQL
        env:
          UV_PYTHON: '3.12'
          TEST_NEWS_POSTGRES_URL: postgresql+psycopg://capacity:capacity@127.0.0.1:55432/capacity
        run: uv run pytest -q tests/test_global_discovery.py tests/test_syndication.py tests/test_research.py tests/test_reader_intelligence.py
  release:
    name: Release CI
    needs: [verify, mail-capacity]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require successful results from all test jobs
        env:
          VALIDATION_RESULT: ${{ needs.verify.result }}
          POSTGRES_RESULT: ${{ needs.mail-capacity.result }}
        run: |
          if [[ "$VALIDATION_RESULT" != "success" || "$POSTGRES_RESULT" != "success" ]]; then
            echo "::error::Release blocked. Validation: $VALIDATION_RESULT. PostgreSQL rehearsal: $POSTGRES_RESULT."
            exit 1
          fi
