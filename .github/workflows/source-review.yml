name: Review publisher discovery and source health
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Discover publisher-declared feeds
        run: uv run python -m scripts.discover_source_feeds --seeds app/discovery_seeds.json --report reports/discovered-feeds.json
      - name: Summarize discovered feeds
        run: uv run python -m scripts.summarize_discovery reports/discovered-feeds.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate reviewed source pack
        run: uv run python -m scripts.check_source_pack app/source_catalog.json --report reports/source-health.json
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publisher-review
          path: reports/*.json
          retention-days: 30
