name: Review publisher discovery and source health
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Discover publisher-declared feeds
        run: uv run python -m scripts.discover_source_feeds --seeds app/discovery_seeds.json --report reports/discovered-feeds.json
      - name: Validate reviewed source pack
        run: uv run python -m scripts.check_source_pack app/source_catalog.json --report reports/source-health.json
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-review
          path: reports/*.json
          retention-days: 30
