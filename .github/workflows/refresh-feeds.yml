name: Refresh world tech feeds
on:
  schedule:
    # This trigger only processes mail and intelligence.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      feeds_only:
        description: Check publishers during the current sweep without sending morning mail
        type: boolean
        default: true
      intelligence_only:
        description: Update the search index and intelligence briefing only
        type: boolean
        default: false

permissions: {}
concurrency:
  group: world-tech-jobs-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' && !inputs.intelligence_only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
    steps:
      - name: Check published sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FEED_REFRESH_SECRET" ]]; then
            echo '::error::FEED_REFRESH_SECRET is missing. See docs/LAUNCH.md.'
            exit 1
          fi
          # Multiple batches cover distinct sources in the same sweep.
          deadline=$((SECONDS + 1800))
          finished=false
          for batch in {1..20}; do
            result=$(curl --silent --show-error --fail --max-time 125 \
              --header @- 'https://getinformdaily.com/api/jobs/refresh?run=scheduled' \
              <<< "Authorization: Bearer $FEED_REFRESH_SECRET")
            jq '{status, checked, healthy, remaining, deferred, scheduled_at}' <<< "$result"
            jq -r '.failures[]? | "::warning::\(.label) (\(.id)): \(.reason)"' <<< "$result"
            jq -r '.deferrals[]? | "::warning::\(.label) (\(.id)): backoff until \(.retry_at)"' <<< "$result"
            jq -r '.unconfirmed[]? | "::error::\(.): started without a recorded result. Skipping repeat attempt."' <<< "$result"
            status=$(jq -r '.status' <<< "$result")
            if [[ "$status" == "closed" ]]; then
              echo 'Publisher checks are only allowed in the 45-minute windows from 08:00 and 20:00 IST.'
              exit 0
            fi
            if jq -e '(.status == "complete" or .status == "refreshed") and .remaining == 0' <<< "$result" > /dev/null; then
              jq -e '(.unconfirmed | length) == 0' <<< "$result" > /dev/null
              finished=true
              break
            fi
            if ! jq -e '.status == "refreshed" and .checked > 0 and .remaining > 0' <<< "$result" > /dev/null; then
              echo '::error::Publisher sweep did not advance. See the batch status above.'
              exit 1
            fi
            if (( SECONDS >= deadline )); then break; fi
          done
          if [[ "$finished" != true ]]; then
            echo '::error::Publisher sweep reached its batch or time limit before all eligible sources were checked.'
            exit 1
          fi
          ready=$(curl --silent --show-error --fail-with-body --max-time 10 \
            'https://ai-news-to-email-generator.vercel.app/api/ready')
          jq -e '.freshness.counts | select(.fresh > 0)' <<< "$ready"
          if [[ $(jq -r '.status' <<< "$ready") == 'degraded' ]]; then
            echo '::warning::Some feeds are behind or unavailable. See the public source catalog.'
          fi
          health=$(curl --silent --show-error --fail --max-time 15 \
            'https://ai-news-to-email-generator.vercel.app/api/discovery/ingestion')
          jq . <<< "$health"
          jq -e '.status != "stalled"' <<< "$health"
  mail:
    if: github.event.schedule == '2-57/5 * * * *' || (github.event_name == 'workflow_dispatch' && !inputs.intelligence_only && !inputs.feeds_only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
    steps:
      - name: Process opted-in morning briefs
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 105 \
            --header @- 'https://ai-news-to-email-generator.vercel.app/api/jobs/morning' \
            <<< "Authorization: Bearer $FEED_REFRESH_SECRET" | jq -e \
            'select(.status == "disabled" or (.sent >= 0 and .unconfirmed == 0))'
          health=$(curl --silent --show-error --fail --max-time 15 \
            --header @- 'https://ai-news-to-email-generator.vercel.app/api/jobs/mail-health' \
            <<< "Authorization: Bearer $FEED_REFRESH_SECRET")
          jq -e '.mode and (.due >= 0) and (.queued >= 0)' <<< "$health"
          jq '{mode, sending_enabled, delivery_events_configured, digest_daily_limit, due, queued}' <<< "$health"
          if jq -e '[.oldest_due_seconds, .oldest_queued_seconds] | max > 900' <<< "$health" > /dev/null; then
            echo '::error::Morning mail backlog is more than 15 minutes old.'
            exit 1
          fi
  intelligence:
    if: github.event.schedule == '2-57/5 * * * *' || inputs.intelligence_only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
    steps:
      - name: Check topic alerts and update the intelligence briefing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FEED_REFRESH_SECRET" ]]; then
            echo '::error::FEED_REFRESH_SECRET is missing. See docs/LAUNCH.md.'
            exit 1
          fi
          result=$(curl --silent --show-error --fail --max-time 80 \
            --header @- 'https://ai-news-to-email-generator.vercel.app/api/jobs/intelligence' \
            <<< "Authorization: Bearer $FEED_REFRESH_SECRET")
          jq '{status, monitoring_status, watches_checked, alerts_created, index_status, indexed, brief_status}' <<< "$result"
          jq -e '(.status == "already_started") or (.status == "checked"
            and (.index_status | IN("updated", "current", "disabled", "budget_limited"))
            and (.brief_status | IN("answered", "current", "disabled", "insufficient", "budget_limited")))' \
            <<< "$result" > /dev/null
