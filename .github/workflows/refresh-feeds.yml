name: Refresh world tech feeds
on:
  schedule:
    # Backup for morning mail only, every three hours. Vercel's hourly intelligence crons
    # already release due briefs and update the index; polling Vercel every five minutes
    # used most of the Hobby plan's Active CPU allowance (paused on 23 November).
    - cron: '23 */3 * * *'
    # Vercel's 08:00/20:00 IST schedule starts the sweep here through workflow_dispatch.
    # These follow-ups finish it if that start was missed. GitHub schedule cron is UTC:
    # 02:40 and 14:40 UTC are 08:10 and 20:10 IST.
    - cron: '40 2,14 * * *'
    # Light checks of the busiest newsrooms, advisories and status pages between full
    # sweeps: 20:32 and 08:32 UTC are 02:02 and 14:02 IST (each window is two hours).
    - cron: '32 8,20 * * *'
    # GitHub often starts scheduled jobs hours late or skips them, so a second follow-up
    # (05:17 and 17:17 UTC = 10:47 and 22:47 IST) finishes the same sweep if the first did not.
    # Each source is still checked once per sweep; with nothing left, this run takes seconds.
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      feeds_only:
        description: Check publishers during the current sweep without sending morning mail
        type: boolean
        default: true
      intelligence_only:
        description: Update the search index and intelligence briefing only
        type: boolean
        default: false
      run:
        description: Which publisher check to run
        type: choice
        options: [full, priority]
        default: full

permissions: {}
concurrency:
  group: world-tech-jobs-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  refresh:
    # Vercel's 08:00/20:00 IST schedule starts this run through workflow_dispatch when
    # GITHUB_SWEEP_TOKEN is set; the two schedules below finish any sweep left unfinished.
    if: (github.event_name == 'workflow_dispatch' && !inputs.intelligence_only && inputs.run != 'priority') || (github.event_name == 'schedule' && (github.event.schedule == '40 2,14 * * *' || github.event.schedule == '17 5,17 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --no-dev
      - name: Check published sources
        # Feeds are fetched here and written to the production database, so Vercel's
        # Active CPU allowance does not limit the size of the source catalog.
        # Each source is still checked once per sweep; a run started while another is
        # working waits for its lease.
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
          PUBLIC_ORIGIN: https://getinformdaily.com
        run: uv run --no-dev python -m scripts.run_publisher_sweep --run full --budget-minutes 30
  mail:
    if: github.event.schedule == '23 */3 * * *' || (github.event_name == 'workflow_dispatch' && !inputs.intelligence_only && !inputs.feeds_only && inputs.run != 'priority')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
    steps:
      - name: Process opted-in morning briefs
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 105 \
            --header @- 'https://ai-news-to-email-generator.vercel.app/api/jobs/morning' \
            <<< "Authorization: Bearer $FEED_REFRESH_SECRET" | jq -e \
            'select(.status == "disabled" or (.sent >= 0 and .unconfirmed == 0))'
          health=$(curl --silent --show-error --fail --max-time 15 \
            --header @- 'https://ai-news-to-email-generator.vercel.app/api/jobs/mail-health' \
            <<< "Authorization: Bearer $FEED_REFRESH_SECRET")
          jq -e '.mode and (.due >= 0) and (.queued >= 0)' <<< "$health"
          jq '{mode, sending_enabled, delivery_events_configured, digest_daily_limit, due, queued}' <<< "$health"
          if jq -e '[.oldest_due_seconds, .oldest_queued_seconds] | max > 900' <<< "$health" > /dev/null; then
            echo '::error::Morning mail backlog is more than 15 minutes old.'
            exit 1
          fi
  intelligence:
    if: inputs.intelligence_only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
    steps:
      - name: Check topic alerts and update the intelligence briefing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FEED_REFRESH_SECRET" ]]; then
            echo '::error::FEED_REFRESH_SECRET is missing. See docs/LAUNCH.md.'
            exit 1
          fi
          result=$(curl --silent --show-error --fail --max-time 80 \
            --header @- 'https://ai-news-to-email-generator.vercel.app/api/jobs/intelligence' \
            <<< "Authorization: Bearer $FEED_REFRESH_SECRET")
          jq '{status, monitoring_status, watches_checked, alerts_created, index_status, indexed, brief_status, ai_issue}' <<< "$result"
          issue=$(jq -r '.ai_issue // empty' <<< "$result")
          case "$issue" in
            authentication) echo '::error::OpenAI rejected OPENAI_API_KEY (401). Create a new key and update OPENAI_API_KEY in Vercel production, then redeploy. See docs/LAUNCH.md.' ;;
            permission) echo '::error::The OpenAI key lacks permission for the configured models. Allow chat completions and embeddings for the key or project.' ;;
            quota) echo '::error::The OpenAI account has no remaining quota or credit. Check billing on platform.openai.com.' ;;
            model_unavailable) echo '::error::The configured OpenAI model is unavailable to this key. Check OPENAI_MODEL and NEWS_AI_ANALYSIS_MODEL.' ;;
            "") ;;
            *) echo "::warning::AI provider issue ($issue). Monitoring ran; AI indexing or the briefing will retry on the next run." ;;
          esac
          if [[ $(jq -r '.ai_action_required // false' <<< "$result") == true ]]; then
            exit 1
          fi
          # Transient provider issues degrade AI output without failing the scheduled check.
          jq -e '(.ai_issue != null) as $transient | (.status == "already_started") or (.status == "checked"
            and (.index_status | IN("updated", "current", "disabled", "budget_limited")
                 or ($transient and . == "provider_unavailable"))
            and (.brief_status | IN("answered", "current", "disabled", "insufficient", "budget_limited")
                 or ($transient and . == "unavailable")))' \
            <<< "$result" > /dev/null
  priority:
    if: github.event.schedule == '32 8,20 * * *' || (github.event_name == 'workflow_dispatch' && inputs.run == 'priority')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --no-dev
      - name: Check the busiest sources
        # Unchecked sources are still covered by the next full sweep.
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
        run: uv run --no-dev python -m scripts.run_publisher_sweep --run priority --budget-minutes 15
