name: Refresh world tech feeds
on:
  schedule:
    # The frequent trigger only processes mail and intelligence.
    - cron: '2-57/5 * * * *'
    # Finish any sources left due by Vercel's bounded 08:00/20:00 IST sweep.
    # GitHub schedule cron is UTC: 02:40 and 14:40 UTC are 08:10 and 20:10 IST,
    # after Vercel's first batch has started.
    - cron: '40 2,14 * * *'
    # Light checks of the busiest newsrooms, advisories and status pages between full
    # sweeps: 20:32 and 08:32 UTC are 02:02 and 14:02 IST (each window is two hours).
    - cron: '32 8,20 * * *'
    # GitHub often starts scheduled jobs hours late or skips them, so a second follow-up
    # (05:17 and 17:17 UTC = 10:47 and 22:47 IST) finishes the same sweep if the first did not.
    # Each source is still checked once per sweep; with nothing left, this run takes seconds.
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      feeds_only:
        description: Check publishers during the current sweep without sending morning mail
        type: boolean
        default: true
      intelligence_only:
        description: Update the search index and intelligence briefing only
        type: boolean
        default: false

permissions: {}
concurrency:
  group: world-tech-jobs-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: (github.event_name == 'workflow_dispatch' && !inputs.intelligence_only) || (github.event_name == 'schedule' && (github.event.schedule == '40 2,14 * * *' || github.event.schedule == '17 5,17 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
    steps:
      - name: Check published sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FEED_REFRESH_SECRET" ]]; then
            echo '::error::FEED_REFRESH_SECRET is missing. See docs/LAUNCH.md.'
            exit 1
          fi
          # Multiple batches cover distinct sources in the same sweep.
          deadline=$((SECONDS + 1800))
          finished=false
          for batch in {1..20}; do
            result=$(curl --silent --show-error --fail --max-time 125 \
              --header @- 'https://getinformdaily.com/api/jobs/refresh?run=scheduled' \
              <<< "Authorization: Bearer $FEED_REFRESH_SECRET")
            jq '{status, checked, healthy, remaining, deferred, scheduled_at}' <<< "$result"
            jq -r '.failures[]? | "::warning::\(.label) (\(.id)): \(.reason)"' <<< "$result"
            jq -r '.deferrals[]? | "::warning::\(.label) (\(.id)): backoff until \(.retry_at)"' <<< "$result"
            jq -r '.unconfirmed[]? | "::error::\(.): started without a recorded result. Skipping repeat attempt."' <<< "$result"
            status=$(jq -r '.status' <<< "$result")
            if [[ "$status" == "already_started" ]]; then
              # Vercel's scheduled batch holds the refresh lease; wait for it and continue.
              if (( SECONDS >= deadline )); then break; fi
              sleep 30
              continue
            fi
            if [[ "$status" == "closed" ]]; then
              echo 'This sweep is closed; the next one starts at 08:00 or 20:00 IST.'
              exit 0
            fi
            if jq -e '(.status == "complete" or .status == "refreshed") and .remaining == 0' <<< "$result" > /dev/null; then
              jq -e '(.unconfirmed | length) == 0' <<< "$result" > /dev/null
              finished=true
              break
            fi
            if ! jq -e '.status == "refreshed" and .checked > 0 and .remaining > 0' <<< "$result" > /dev/null; then
              echo '::error::Publisher sweep did not advance. See the batch status above.'
              exit 1
            fi
            if (( SECONDS >= deadline )); then break; fi
          done
          if [[ "$finished" != true ]]; then
            echo '::error::Publisher sweep reached its batch or time limit before all eligible sources were checked.'
            exit 1
          fi
          ready=$(curl --silent --show-error --fail-with-body --max-time 10 \
            'https://ai-news-to-email-generator.vercel.app/api/ready')
          jq -e '.freshness.counts | select(.fresh > 0)' <<< "$ready"
          if [[ $(jq -r '.status' <<< "$ready") == 'degraded' ]]; then
            echo '::warning::Some feeds are behind or unavailable. See the public source catalog.'
          fi
          health=$(curl --silent --show-error --fail --max-time 15 \
            'https://ai-news-to-email-generator.vercel.app/api/discovery/ingestion')
          jq . <<< "$health"
          jq -e '.status != "stalled"' <<< "$health"
  mail:
    if: github.event.schedule == '2-57/5 * * * *' || (github.event_name == 'workflow_dispatch' && !inputs.intelligence_only && !inputs.feeds_only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
    steps:
      - name: Process opted-in morning briefs
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 105 \
            --header @- 'https://ai-news-to-email-generator.vercel.app/api/jobs/morning' \
            <<< "Authorization: Bearer $FEED_REFRESH_SECRET" | jq -e \
            'select(.status == "disabled" or (.sent >= 0 and .unconfirmed == 0))'
          health=$(curl --silent --show-error --fail --max-time 15 \
            --header @- 'https://ai-news-to-email-generator.vercel.app/api/jobs/mail-health' \
            <<< "Authorization: Bearer $FEED_REFRESH_SECRET")
          jq -e '.mode and (.due >= 0) and (.queued >= 0)' <<< "$health"
          jq '{mode, sending_enabled, delivery_events_configured, digest_daily_limit, due, queued}' <<< "$health"
          if jq -e '[.oldest_due_seconds, .oldest_queued_seconds] | max > 900' <<< "$health" > /dev/null; then
            echo '::error::Morning mail backlog is more than 15 minutes old.'
            exit 1
          fi
  intelligence:
    if: github.event.schedule == '2-57/5 * * * *' || inputs.intelligence_only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
    steps:
      - name: Check topic alerts and update the intelligence briefing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FEED_REFRESH_SECRET" ]]; then
            echo '::error::FEED_REFRESH_SECRET is missing. See docs/LAUNCH.md.'
            exit 1
          fi
          result=$(curl --silent --show-error --fail --max-time 80 \
            --header @- 'https://ai-news-to-email-generator.vercel.app/api/jobs/intelligence' \
            <<< "Authorization: Bearer $FEED_REFRESH_SECRET")
          jq '{status, monitoring_status, watches_checked, alerts_created, index_status, indexed, brief_status, ai_issue}' <<< "$result"
          issue=$(jq -r '.ai_issue // empty' <<< "$result")
          case "$issue" in
            authentication) echo '::error::OpenAI rejected OPENAI_API_KEY (401). Create a new key and update OPENAI_API_KEY in Vercel production, then redeploy. See docs/LAUNCH.md.' ;;
            permission) echo '::error::The OpenAI key lacks permission for the configured models. Allow chat completions and embeddings for the key or project.' ;;
            quota) echo '::error::The OpenAI account has no remaining quota or credit. Check billing on platform.openai.com.' ;;
            model_unavailable) echo '::error::The configured OpenAI model is unavailable to this key. Check OPENAI_MODEL and NEWS_AI_ANALYSIS_MODEL.' ;;
            "") ;;
            *) echo "::warning::AI provider issue ($issue). Monitoring ran; AI indexing or the briefing will retry on the next run." ;;
          esac
          if [[ $(jq -r '.ai_action_required // false' <<< "$result") == true ]]; then
            exit 1
          fi
          # Transient provider issues degrade AI output without failing the scheduled check.
          jq -e '(.ai_issue != null) as $transient | (.status == "already_started") or (.status == "checked"
            and (.index_status | IN("updated", "current", "disabled", "budget_limited")
                 or ($transient and . == "provider_unavailable"))
            and (.brief_status | IN("answered", "current", "disabled", "insufficient", "budget_limited")
                 or ($transient and . == "unavailable")))' \
            <<< "$result" > /dev/null
  priority:
    if: github.event.schedule == '32 8,20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEED_REFRESH_SECRET: ${{ secrets.FEED_REFRESH_SECRET }}
    steps:
      - name: Check the busiest sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FEED_REFRESH_SECRET" ]]; then
            echo '::error::FEED_REFRESH_SECRET is missing. See docs/LAUNCH.md.'
            exit 1
          fi
          deadline=$((SECONDS + 900))
          for batch in {1..10}; do
            result=$(curl --silent --show-error --fail --max-time 125 \
              --header @- 'https://getinformdaily.com/api/jobs/refresh?run=priority' \
              <<< "Authorization: Bearer $FEED_REFRESH_SECRET")
            jq '{status, checked, healthy, remaining, deferred, scheduled_at}' <<< "$result"
            jq -r '.failures[]? | "::warning::\(.label) (\(.id)): \(.reason)"' <<< "$result"
            status=$(jq -r '.status' <<< "$result")
            if [[ "$status" == "closed" ]]; then
              # GitHub started this run after the two-hour window; the next full sweep covers it.
              echo '::warning::Priority window closed before this run started.'
              exit 0
            fi
            if [[ "$status" == "already_started" ]]; then
              if (( SECONDS >= deadline )); then break; fi
              sleep 20
              continue
            fi
            if jq -e '.remaining == 0' <<< "$result" > /dev/null; then
              exit 0
            fi
            if ! jq -e '.status == "refreshed" and .checked > 0' <<< "$result" > /dev/null; then
              echo '::error::Priority check did not advance. See the batch status above.'
              exit 1
            fi
            if (( SECONDS >= deadline )); then break; fi
          done
          # Unchecked sources are still covered by the next full sweep.
          echo '::warning::Priority check reached its time limit with sources remaining.'
