<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f4ee" />
    <title>Sources | Informa AI</title>
    <link rel="icon" href="/informa-ai-icon.png" type="image/png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/launch.css" />
    <script defer src="/sources.js"></script>
  </head>
  <body>
    <header class="topbar wrap">
      <a class="brand" href="/" aria-label="Informa AI home">
        <img class="brand-icon" src="/informa-ai-icon.png" width="33" height="33" alt="" />
        <span>Informa AI</span>
      </a>
      <nav aria-label="Main navigation">
        <a class="text-button" href="/">Latest stories</a>
        <select id="site-theme" class="theme-select" aria-label="App color theme" disabled>
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </nav>
    </header>
    <main class="wrap directory">
      <div class="directory-heading">
        <h1>Source directory</h1>
        <p>Browse the publishers, researchers, creators, and official status feeds behind the Reading Room.</p>
      </div>
      <div class="directory-controls">
        <label for="source-search">Find a source
          <input id="source-search" type="search" maxlength="120" placeholder="Publisher, topic, or region">
        </label>
        <label for="source-filter">Feed status
          <select id="source-filter">
            <option value="all">Any status</option>
            <option value="fresh">Up to date</option>
            <option value="stale">Check overdue</option>
            <option value="failed">Last check failed</option>
            <option value="pending">Awaiting first check</option>
            <option value="paused">Paused</option>
          </select>
        </label>
      </div>
      <p id="source-status" role="status" aria-live="polite"></p>
      <button id="source-retry" class="button secondary" type="button" hidden>Try again</button>
      <div id="source-rows" class="source-table"></div>
    </main>
  </body>
</html>
