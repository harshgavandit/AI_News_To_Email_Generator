<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f4ee" />
    <meta name="description" content="Browse Informa AI’s global technology news sources by publisher region, focus, source type, and feed status." />
    <title>Sources | Informa AI</title>
    <link rel="icon" href="/informa-ai-icon.png" type="image/png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/launch.css" />
    <script type="module" src="/sources.js"></script>
  </head>
  <body>
    <a class="skip" href="#source-search">Skip to source search</a>
    <header class="topbar wrap">
      <a class="brand" href="/" aria-label="Informa AI home">
        <img class="brand-icon" src="/informa-ai-icon.png" width="33" height="33" alt="" />
        <span>Informa AI</span>
      </a>
      <nav aria-label="Main navigation">
        <a class="text-button" href="/">Latest stories</a>
        <select id="site-theme" class="theme-select" aria-label="App color theme" disabled>
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </nav>
    </header>
    <main class="wrap directory">
      <div class="directory-heading">
        <h1>Source directory</h1>
        <p>Find the publications, research feeds, and advisories behind the Reading Room. See when each feed was last checked and browse its stories.</p>
      </div>
      <div class="directory-controls">
        <label for="source-search">Find a source
          <input id="source-search" type="search" maxlength="120" placeholder="Publisher or keyword">
        </label>
        <label for="source-region">Publisher region
          <select id="source-region"><option value="">All regions</option></select>
        </label>
        <label for="source-topic">Feed focus
          <select id="source-topic"><option value="">All topics</option></select>
        </label>
        <label for="source-coverage">Source type
          <select id="source-coverage"><option value="">All source types</option></select>
        </label>
        <label for="source-filter">Feed status
          <select id="source-filter">
            <option value="">Any status</option>
            <option value="fresh">Up to date</option>
            <option value="stale">Check overdue</option>
            <option value="failed">Last check failed</option>
            <option value="pending">Awaiting first check</option>
            <option value="paused">Paused</option>
          </select>
        </label>
      </div>
      <div class="directory-results">
        <p id="source-status" role="status" aria-live="polite"></p>
        <button id="source-reset" class="text-button" type="button" hidden>Reset filters</button>
      </div>
      <button id="source-retry" class="button secondary" type="button" hidden>Try again</button>
      <div id="source-rows" class="source-table" aria-busy="true"></div>
    </main>
  </body>
</html>
